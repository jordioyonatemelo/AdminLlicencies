<title>KUBIK Admin — Gestión de Licencias</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:     #06080f;
  --bg2:    #0b0f1a;
  --bg3:    #111827;
  --border: #1c2436;
  --bord2:  #243044;
  --accent: #1877f2;
  --acc2:   #0d5cbf;
  --green:  #22c55e;
  --gold:   #f59e0b;
  --red:    #ef4444;
  --text:   #e2e8f4;
  --text2:  #8899bb;
  --text3:  #4a5a78;
  --mono:   'JetBrains Mono', monospace;
  --sans:   'Syne', sans-serif;
  --hdr:    58px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; overflow:hidden; }
body {
  background:var(--bg); color:var(--text);
  font-family:var(--sans);
}

/* ── HEADER fijo ── */
.hdr {
  position:fixed; top:0; left:0; right:0;
  height:var(--hdr);
  display:flex; align-items:center; gap:14px;
  padding:0 20px;
  border-bottom:1px solid var(--border);
  background:rgba(6,8,15,0.96);
  z-index:100;
}
.logo {
  width:34px; height:34px;
  background:linear-gradient(135deg,var(--accent),var(--acc2));
  border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-size:17px; flex-shrink:0;
  box-shadow:0 0 18px rgba(24,119,242,0.3);
}
.hdr-title { font-size:16px; font-weight:800; letter-spacing:-0.02em; }
.hdr-sub   { font-size:10px; color:var(--text2); font-family:var(--mono); margin-top:1px; }
.hdr-right { margin-left:auto; display:flex; align-items:center; gap:8px; flex-shrink:0; }
.badge {
  font-family:var(--mono); font-size:10px;
  background:rgba(24,119,242,0.1); border:1px solid rgba(24,119,242,0.22);
  color:#60a5fa; border-radius:20px; padding:2px 10px;
}
.btn-ref {
  background:var(--bg3); border:1px solid var(--bord2);
  color:var(--text2); border-radius:7px; padding:6px 12px;
  font-size:11px; font-family:var(--sans); font-weight:600;
  cursor:pointer; transition:all .15s; white-space:nowrap;
}
.btn-ref:hover { border-color:var(--accent); color:var(--text); }
.btn-ref:disabled { opacity:.45; pointer-events:none; }

@media(max-width:768px) {
  .hdr { gap:8px; padding:0 12px; }
  .logo { width:28px; height:28px; font-size:14px; flex-shrink:0; }
  .hdr-title { font-size:13px; }
  .hdr-sub   { font-size:9px; }
  .badge     { display:none; }
  .btn-ref   { padding:5px 8px; font-size:10px; }
}

/* ── COLUMNAS — posicionamiento absoluto simple ── */
.col-list {
  position:fixed;
  top:var(--hdr); left:0;
  width:340px;
  bottom:0;
  border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  background:var(--bg);
}
.col-detail {
  position:fixed;
  top:var(--hdr); left:340px;
  right:0; bottom:0;
  overflow-y:auto;
  background:var(--bg);
}
.col-detail::-webkit-scrollbar { width:6px; }
.col-detail::-webkit-scrollbar-track { background:var(--bg); }
.col-detail::-webkit-scrollbar-thumb { background:var(--bord2); border-radius:3px; }
.col-detail::-webkit-scrollbar-thumb:hover { background:#3a4a6a; }

/* ── LIST ── */
.ltoolbar {
  padding:12px; border-bottom:1px solid var(--border);
  flex-shrink:0;
  display:flex; flex-direction:column; gap:8px;
}
.srchwrap { position:relative; }
.srchwrap input {
  width:100%; background:var(--bg3); border:1px solid var(--bord2);
  border-radius:8px; color:var(--text); font-family:var(--mono);
  font-size:12px; padding:8px 12px 8px 32px; outline:none;
}
.srchwrap input:focus { border-color:var(--accent); }
.srchico { position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:13px; color:var(--text3); pointer-events:none; }
.ftabs { display:flex; gap:5px; }
.ftab {
  flex:1; padding:5px 4px; border-radius:6px;
  border:1px solid var(--border); background:none;
  color:var(--text3); font-size:10px; font-family:var(--sans); font-weight:700;
  cursor:pointer; transition:all .15s;
}
.ftab.on { background:rgba(24,119,242,0.1); border-color:rgba(24,119,242,0.3); color:#60a5fa; }
.lbody { flex:1; overflow-y:auto; padding:6px; }
.lbody::-webkit-scrollbar { width:3px; }
.lbody::-webkit-scrollbar-thumb { background:var(--bord2); border-radius:2px; }

/* ── CLIENT ROW ── */
.crow {
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:9px;
  border:1px solid transparent; cursor:pointer;
  transition:all .13s; margin-bottom:3px;
}
.crow:hover { background:var(--bg3); border-color:var(--border); }
.crow.on    { background:rgba(24,119,242,0.07); border-color:rgba(24,119,242,0.28); }
.cavatar {
  width:36px; height:36px; border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:800; flex-shrink:0; font-family:var(--mono);
}
.cinfo { flex:1; min-width:0; }
.cname  { font-size:12px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cname.anon { color:var(--text3); font-style:italic; font-weight:400; }
.cemail { font-size:10px; color:var(--text2); font-family:var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px; }
.spill { font-size:9px; font-weight:700; padding:2px 7px; border-radius:20px; font-family:var(--mono); white-space:nowrap; }
.p-act { background:rgba(34,197,94,.1);  border:1px solid rgba(34,197,94,.25);  color:var(--green); }
.p-tri { background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.25); color:var(--gold); }
.p-exp { background:rgba(239,68,68,.1);  border:1px solid rgba(239,68,68,.25);  color:var(--red); }
.lempty { text-align:center; padding:50px 16px; color:var(--text3); font-size:12px; line-height:2; }

/* ── DETAIL ── */
.dempty {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px; color:var(--text3);
}
.dempty-ico { font-size:2.8rem; opacity:.25; }
.dempty-txt { font-size:12px; line-height:1.9; text-align:center; }

.dhdr {
  display:flex; align-items:center; gap:14px;
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  background:var(--bg2);
  position:sticky; top:0; z-index:10;
}
.davatar {
  width:48px; height:48px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; font-weight:800; flex-shrink:0; font-family:var(--mono);
}
.dname { font-size:16px; font-weight:800; letter-spacing:-.02em; }
.did   { font-size:9px; color:var(--text3); font-family:var(--mono); margin-top:3px; letter-spacing:.07em; word-break:break-all; }

/* zona de contenido — sin scroll propio, col-detail lo gestiona */
.dbody {
  padding:18px;
  display:flex; flex-direction:column; gap:14px;
}

/* SAVE BAR */
.sbar {
  padding:12px 18px; border-top:1px solid var(--border);
  background:var(--bg2); display:flex; gap:10px; align-items:center;
  position:sticky; bottom:0; z-index:10;
}
.btsave {
  flex:1; padding:11px;
  background:linear-gradient(135deg,var(--accent),var(--acc2));
  border:none; border-radius:8px; color:#fff;
  font-size:13px; font-weight:700; font-family:var(--sans); cursor:pointer;
}
.btsave:hover { filter:brightness(1.1); }
.btsave:disabled { opacity:.4; cursor:not-allowed; filter:none; }
.smsg { font-size:11px; font-family:var(--mono); opacity:0; transition:opacity .3s; min-width:120px; text-align:right; }
.smsg.ok  { color:var(--green); opacity:1; }
.smsg.err { color:var(--red);   opacity:1; }

/* SECTION CARDS */
.scard { background:var(--bg2); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.shead {
  padding:9px 16px; background:rgba(255,255,255,.02);
  border-bottom:1px solid var(--border);
  font-size:9px; font-weight:700; color:var(--text3);
  letter-spacing:.12em; text-transform:uppercase; font-family:var(--mono);
}
.sbody { padding:14px 16px; display:flex; flex-direction:column; gap:12px; max-height:320px; overflow-y:auto; }
.sbody::-webkit-scrollbar { width:5px; }
.sbody::-webkit-scrollbar-track { background:var(--bg2); }
.sbody::-webkit-scrollbar-thumb { background:var(--bord2); border-radius:3px; }
.sbody::-webkit-scrollbar-thumb:hover { background:#3a4a6a; }

.frow { display:flex; flex-direction:column; gap:3px; }
.flbl { font-size:9px; color:var(--text3); font-family:var(--mono); letter-spacing:.08em; text-transform:uppercase; }
.fval { font-size:12px; color:var(--text); font-family:var(--mono); word-break:break-all; line-height:1.5; }
.fval.green { color:var(--green); }
.fval.gold  { color:var(--gold); }
.fval.red   { color:var(--red); }
.fval.muted { color:var(--text3); }
.fval-sub   { font-size:11px; color:var(--text2); font-family:var(--mono); margin-top:2px; }

.egrp { display:flex; flex-direction:column; gap:5px; }
.elbl { font-size:9px; color:var(--text2); font-family:var(--mono); letter-spacing:.08em; text-transform:uppercase; }
.einp {
  background:var(--bg3); border:1px solid var(--bord2);
  border-radius:8px; color:var(--text); font-family:var(--mono);
  font-size:13px; padding:9px 12px; outline:none;
  transition:border-color .15s; width:100%;
}
.einp:focus { border-color:var(--accent); background:rgba(24,119,242,.04); }
.einp::placeholder { color:var(--text3); }

.stoggle { display:flex; gap:8px; }
.stog-btn {
  flex:1; padding:9px 8px; border-radius:8px; cursor:pointer;
  font-size:12px; font-weight:700; font-family:var(--sans);
  border:1px solid var(--bord2); background:var(--bg3); color:var(--text3);
  transition:all .15s;
}
.stog-btn.active-on   { background:rgba(34,197,94,.12);  border-color:rgba(34,197,94,.35);  color:var(--green); }
.stog-btn.inactive-on { background:rgba(239,68,68,.12);  border-color:rgba(239,68,68,.35);  color:var(--red); }

/* TOAST */
.toast {
  position:fixed; bottom:20px; left:50%;
  transform:translateX(-50%) translateY(70px);
  background:var(--bg3); border:1px solid var(--bord2);
  border-radius:9px; padding:9px 18px;
  font-size:12px; font-family:var(--mono); color:var(--text);
  transition:transform .3s ease; z-index:999; white-space:nowrap;
}
.toast.show { transform:translateX(-50%) translateY(0); }
.toast.ok  { border-color:rgba(34,197,94,.4);  color:var(--green); }
.toast.err { border-color:rgba(239,68,68,.4); color:var(--red); }

/* ── MOBILE ── */
@media(max-width:768px) {
  :root { --hdr: 54px; }
  .col-list {
    position:relative; top:auto; left:auto; width:100%;
    border-right:none; border-bottom:1px solid var(--border);
    max-height:45vh;
  }
  .col-detail {
    position:relative; top:auto; left:auto;
    width:100%; height:auto; min-height:60vh;
  }
  body {
    padding-top:var(--hdr);
    overflow:auto; height:auto;
  }
  html { height:auto; overflow:auto; }
}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">📢</div>
  <div>
    <div class="hdr-title">KUBIK Admin</div>
    <div class="hdr-sub">Gestión de licencias AutoPublisher</div>
  </div>
  <div class="hdr-right">
    <span class="badge" id="badgeTotal">— registros</span>
    <button class="btn-ref" id="btnRef" onclick="loadAll()">↻ Actualizar</button>
  </div>
</div>

<!-- LISTA -->
<div class="col-list">
  <div class="ltoolbar">
    <div class="srchwrap">
      <span class="srchico">🔍</span>
      <input type="text" id="srch" placeholder="Buscar nombre, email, ID..." oninput="renderList()"/>
    </div>
    <div class="ftabs">
      <button class="ftab on" onclick="setF('all',this)">Todos</button>
      <button class="ftab"    onclick="setF('active',this)">Activos</button>
      <button class="ftab"    onclick="setF('trial',this)">Prueba</button>
      <button class="ftab"    onclick="setF('expired',this)">Expirados</button>
    </div>
  </div>
  <div class="lbody" id="lbody"><div class="lempty">Cargando...</div></div>
</div>

<!-- DETALLE -->
<div class="col-detail" id="colDetail">
  <div class="dempty" id="dempty">
    <div class="dempty-ico">👥</div>
    <div class="dempty-txt">Selecciona un cliente<br>para ver sus datos</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const FB_KEY  = 'AIzaSyC_qChi6lqFYL7Nmr-m5akqU6VSz5uNK7I';
const FB_PROJ = 'licencias-autopublicador';
const FB_BASE = `https://firestore.googleapis.com/v1/projects/${FB_PROJ}/databases/(default)/documents`;
const DAYS    = 30;

let records = [], filter = 'all', activeId = null;

function fsToObj(fields) {
  if (!fields) return {};
  const o = {};
  for (const [k,v] of Object.entries(fields)) {
    if (v.stringValue  !== undefined) o[k] = v.stringValue;
    if (v.integerValue !== undefined) o[k] = Number(v.integerValue);
    if (v.booleanValue !== undefined) o[k] = v.booleanValue;
  }
  return o;
}

async function fbList() {
  const res = await fetch(`${FB_BASE}/trials?key=${FB_KEY}&pageSize=300`);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const d = await res.json();
  return (d.documents || []).map(doc => ({
    id:   doc.name.split('/').pop(),
    data: fsToObj(doc.fields)
  }));
}

async function fbSave(docId, cliente, email, activated) {
  const url = `${FB_BASE}/trials/${docId}` +
    `?key=${FB_KEY}` +
    `&updateMask.fieldPaths=Cliente` +
    `&updateMask.fieldPaths=${encodeURIComponent('`E-Mail`')}` +
    `&updateMask.fieldPaths=activated`;
  const res = await fetch(url, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields: {
      'Cliente':   { stringValue:  cliente   },
      'E-Mail':    { stringValue:  email     },
      'activated': { booleanValue: activated }
    }})
  });
  if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + await res.text());
  return res.json();
}

function status(d) {
  if (d.activated && d.code) return 'active';
  if (!d.startedAt) return 'unknown';
  return (DAYS - (Date.now() - d.startedAt) / 86400000) > 0 ? 'trial' : 'expired';
}
function daysLeft(d) {
  if (!d.startedAt) return null;
  return Math.max(0, Math.ceil(DAYS - (Date.now() - d.startedAt) / 86400000));
}
function tsHtml(ms) {
  if (!ms) return '<span class="fval muted">—</span>';
  const d = new Date(ms);
  const fecha = d.toLocaleDateString('es-ES',  { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
  const hora  = d.toLocaleTimeString('es-ES',  { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  return `<span class="fval">${ms}</span><span class="fval-sub">📅 ${fecha} &nbsp;·&nbsp; 🕐 ${hora}</span>`;
}
function aColors(id) {
  const c = [
    ['rgba(24,119,242,.16)','#60a5fa'],['rgba(34,197,94,.16)','#4ade80'],
    ['rgba(245,158,11,.16)','#fbbf24'],['rgba(168,85,247,.16)','#c084fc'],
    ['rgba(236,72,153,.16)','#f472b6'],['rgba(20,184,166,.16)','#2dd4bf'],
  ];
  return c[id.charCodeAt(0) % c.length];
}
function aLetter(d,id) { return d.Cliente&&d.Cliente.trim() ? d.Cliente.trim()[0].toUpperCase() : id.substring(0,2); }
function pill(s,dl) {
  if (s==='active')  return `<span class="spill p-act">✓ Activo</span>`;
  if (s==='trial')   return `<span class="spill p-tri">⏱ ${dl}d</span>`;
  if (s==='expired') return `<span class="spill p-exp">✗ Exp.</span>`;
  return '';
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function loadAll() {
  const btn = document.getElementById('btnRef');
  btn.disabled=true; btn.textContent='↻ ...';
  try {
    records = await fbList();
    records.sort((a,b)=>{
      const na=(a.data.Cliente||'').toLowerCase(), nb=(b.data.Cliente||'').toLowerCase();
      if(!na&&nb) return 1; if(na&&!nb) return -1; return na.localeCompare(nb);
    });
    document.getElementById('badgeTotal').textContent = records.length + ' registros';
    renderList();
    toast(records.length + ' registros cargados','ok');
  } catch(e) {
    toast('Error: '+e.message,'err');
    document.getElementById('lbody').innerHTML=`<div class="lempty">❌ ${e.message}</div>`;
  }
  btn.disabled=false; btn.textContent='↻ Actualizar';
}

function renderList() {
  const q=document.getElementById('srch').value.toLowerCase();
  const lb=document.getElementById('lbody');
  const list=records.filter(r=>{
    const s=status(r.data);
    if(filter!=='all'&&s!==filter) return false;
    if(!q) return true;
    return (r.data.Cliente||'').toLowerCase().includes(q)||
           (r.data['E-Mail']||'').toLowerCase().includes(q)||
           r.id.toLowerCase().includes(q);
  });
  if(!list.length){lb.innerHTML='<div class="lempty">Sin resultados</div>';return;}
  lb.innerHTML=list.map(r=>{
    const s=status(r.data),dl=daysLeft(r.data);
    const [bg,tc]=aColors(r.id);
    const name=r.data.Cliente&&r.data.Cliente.trim()?r.data.Cliente:null;
    const email=r.data['E-Mail']&&r.data['E-Mail'].trim()?r.data['E-Mail']:r.id.substring(0,14)+'…';
    return `<div class="crow ${activeId===r.id?'on':''}" onclick="sel('${r.id}')">
      <div class="cavatar" style="background:${bg};color:${tc}">${aLetter(r.data,r.id)}</div>
      <div class="cinfo">
        <div class="cname ${!name?'anon':''}">${esc(name||'Sin nombre')}</div>
        <div class="cemail">${esc(email)}</div>
      </div>
      <div>${pill(s,dl)}</div>
    </div>`;
  }).join('');
}

function setF(f,el){
  filter=f;
  document.querySelectorAll('.ftab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  renderList();
}

function sel(id) {
  activeId=id; renderList();
  const r=records.find(x=>x.id===id);
  if(!r) return;
  renderDetail(r);
  if(window.innerWidth<=768) document.getElementById('colDetail').scrollIntoView({behavior:'smooth'});
}

function renderDetail(r) {
  const {id,data}=r;
  const s=status(data),dl=daysLeft(data);
  const [bg,tc]=aColors(id);
  const name=data.Cliente&&data.Cliente.trim()?data.Cliente:'Sin nombre';
  const sLabel=s==='active'?'<span class="fval green">✓ Licencia activa</span>'
    :s==='trial'?`<span class="fval gold">⏱ En prueba — ${dl} días restantes</span>`
    :s==='expired'?'<span class="fval red">✗ Prueba expirada</span>'
    :'<span class="fval muted">—</span>';

  const col=document.getElementById('colDetail');
  col.innerHTML = `
    <div class="dhdr">
      <div class="davatar" style="background:${bg};color:${tc}">${aLetter(data,id)}</div>
      <div style="flex:1;min-width:0">
        <div class="dname">${esc(name)}</div>
        <div class="did">${id}</div>
      </div>
      ${pill(s,dl)}
    </div>

    <div class="dbody">
      <div class="scard">
        <div class="shead">✏️ &nbsp;Datos del cliente</div>
        <div class="sbody">
          <div class="egrp">
            <label class="elbl">Estado de licencia</label>
            <div class="stoggle">
              <button type="button" class="stog-btn ${data.activated?'active-on':''}"   id="togA" onclick="setAct(true)">✓ Activo</button>
              <button type="button" class="stog-btn ${!data.activated?'inactive-on':''}" id="togI" onclick="setAct(false)">✗ Inactivo</button>
            </div>
          </div>
          <div class="egrp">
            <label class="elbl">Nombre del cliente</label>
            <input class="einp" id="eCliente" type="text" placeholder="Nombre..." value="${esc(data.Cliente||'')}"/>
          </div>
          <div class="egrp">
            <label class="elbl">E-Mail</label>
            <input class="einp" id="eEmail" type="email" placeholder="correo@ejemplo.com" value="${esc(data['E-Mail']||'')}"/>
          </div>
        </div>
      </div>

      <div class="scard">
        <div class="shead">🔐 &nbsp;Estado de licencia</div>
        <div class="sbody">
          <div class="frow"><div class="flbl">Estado</div>${sLabel}</div>
          ${data.code?`<div class="frow"><div class="flbl">Código de activación</div><div class="fval" style="font-size:11px;letter-spacing:.1em">${esc(data.code)}</div></div>`:''}
          <div class="frow"><div class="flbl">Inicio prueba</div>${tsHtml(data.startedAt)}</div>
          <div class="frow"><div class="flbl">Activado el</div>${tsHtml(data.activatedAt)}</div>
        </div>
      </div>

      <div class="scard">
        <div class="shead">🖥 &nbsp;Dispositivo</div>
        <div class="sbody">
          <div class="frow">
            <div class="flbl">Browser Fingerprint (ID)</div>
            <div class="fval" style="font-size:10px;letter-spacing:.05em">${id}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="sbar">
      <span class="smsg" id="smsg"></span>
      <button class="btsave" id="btsave" onclick="save('${id}')">💾 Guardar cambios</button>
    </div>`;
}

function setAct(val) {
  document.getElementById('togA').classList.toggle('active-on',   val);
  document.getElementById('togI').classList.toggle('inactive-on', !val);
}

async function save(id) {
  const btn=document.getElementById('btsave');
  const msgEl=document.getElementById('smsg');
  const cliente=document.getElementById('eCliente').value.trim();
  const email=document.getElementById('eEmail').value.trim();
  const activated=document.getElementById('togA').classList.contains('active-on');
  btn.disabled=true; btn.textContent='Guardando...';
  msgEl.className='smsg';
  try {
    await fbSave(id,cliente,email,activated);
    const r=records.find(x=>x.id===id);
    if(r){r.data.Cliente=cliente;r.data['E-Mail']=email;r.data.activated=activated;}
    renderList();
    renderDetail(records.find(x=>x.id===id));
    toast('Datos guardados correctamente','ok');
  } catch(e) {
    msgEl.textContent='✗ Error al guardar'; msgEl.className='smsg err';
    toast('Error: '+e.message,'err');
  }
  btn.disabled=false; btn.textContent='💾 Guardar cambios';
}

let tt;
function toast(msg,type){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className=`toast ${type} show`;
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),3500);
}

loadAll();
</script>
</body>
</html>
